<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Hasti! ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #141414;
            color: white;
            font-family: Tahoma, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #start-btn {
            padding: 15px 35px;
            font-size: 22px;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
        }

        #container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .line {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
        }

        @keyframes flowUp {
            0% {
                transform: translateY(110vh);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-20vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <button id="start-btn">برای تو که لطف خدا تو زندگیمی ❤️</button>

    <div id="container"></div>

    <audio id="bg-music" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>


    <script>
        const textLines = [
            "هستی قشنگ من",
            "سلام",
            "الان که داری اینو میخونی",
            "آبان سال ۱۴۰۵ عه",
            "تو ۲۱ ساله شدی",
            "و",
            "ما وارد سال حداقل ۱۶ ام دوستیمون شدیم",
            "و الان سه سال میشه که روز تولدت ازت هزاران کیلومتر فاصله دارم",
            "تو همه سالایی که گذشت",
            "با همه خوشی ها و ناراحتیاش",
            "روز به روز بیشتر تو دلم جا باز کردی",
            "و الان اندازه خودم دوستت دارم",
            "دور بودن ازت تو این مدت ها",
            "هرروز بهم یاداوری میکرد که قدر روزای کودکی و نوجوونیمون رو ندونستیم",
            "و حالا بزرگسالى نشونمون داد قرار نیس تا همیشه هر زنگ تفریح همو ببینیم",
            "حالا",
            "این هدیه و این نامه صرفا یک یاداوری برای این بود",
            "که بدونی تا همیشه وهمه جا ، تا اخر عمر",
            "جایی که تو قلبم داری رو به هیچکس نمیدم",
            "امیدوارم یه روزی تو سال های اینده",
            "وقتی به همه ارزوهامون رسیدیم",
            "دوباره این نامه رو بخونی",
            "و اونموقع دیگه همه چی بر وفق مراد باشه",
            "خیلی خیلی دوستت دارمم",
            "تولدت مبارک عزیزترینم 🫂❤️❤️❤️",
            "1405/8/1"
        ];

        const colors = ['#ff69b4', '#90ee90', '#add8e6', '#ffff00', '#ffb6c1', '#dda0dd'];

        const startBtn = document.getElementById('start-btn');
        const container = document.getElementById('container');
        const music = document.getElementById('bg-music');

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            container.style.display = 'block';
            music.play().catch(e => console.log("Audio error"));

            // تنظیمات برای اینکه حداقل ۳ خط در صفحه باشه
            // duration (زمان حرکت) باید بیشتر از delay باشد
            const duration = 8; 
            const delayBetweenLines = 1.5; 

            textLines.forEach((lineText, index) => {
                const div = document.createElement('div');
                div.className = 'line';
                div.innerText = lineText;
                div.style.color = colors[index % colors.length];
                
                div.style.animation = `flowUp ${duration}s linear forwards`;
                div.style.animationDelay = (index * delayBetweenLines) + 's';
                
                container.appendChild(div);
            });

            // محاسبه زمان پایان کل انیمیشن‌ها
            // زمان آخرین خط = (تعداد خطوط * فاصله بین خطوط) + مدت زمان حرکت خود آن خط
            const totalTime = (textLines.length * delayBetweenLines) + duration;

            // نمایش دوباره دکمه بعد از اتمام همه خطوط
            setTimeout(() => {
                // پاک کردن خطوط قدیمی برای شروع مجدد تمیز
                container.innerHTML = '';
                container.style.display = 'none';
                startBtn.style.display = 'block';
            }, totalTime * 1000);
        });
    </script>
</body>
</html>
