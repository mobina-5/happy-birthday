<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Hasti! ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            color: #141414;
            font-family: Tahoma, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* عکس پس‌زمینه با نام ax */
        #background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('ax.jpg'); /* اگر پسوند عکست png است به ax.png تغییر بده */
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        /* یک لایه ملایم روشن/سفید نیمه‌شفاف برای خوانایی بهتر متن روی بک‌گراند روشن */
        #overlay-light {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.4); 
            z-index: -1;
        }

        #start-btn {
            padding: 15px 35px;
            font-size: 22px;
            background: linear-gradient(45deg, #4a154b, #1d1c3a);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        #container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .line {
            position: absolute;
            left: 50%;
            transform: translateX(-50%) translateY(110vh);
            width: 90%;
            max-width: 600px;
            text-align: center;
            font-size: clamp(18px, 4.5vw, 24px);
            font-weight: bold;
            white-space: normal;
            word-wrap: break-word;
            opacity: 0;
        }

        @keyframes flowUp {
            0% {
                transform: translateX(-50%) translateY(110vh);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateX(-50%) translateY(-20vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div id="background-overlay"></div>
    <div id="overlay-light"></div>

    <button id="start-btn">برای تو که قشنگترین دختر دنیایی ❤️</button>

    <div id="container"></div>

    <audio id="bg-music" preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>


    <script>
        const textLines = [
            "هستی قشنگ من",
            "سلام",
            "الان که داری اینو میخونی",
            "آبان سال ۱۴۰۵ عه",
            "تو ۲۱ ساله شدی",
            "و",
            "ما وارد سال حداقل ۱۶ ام دوستیمون شدیم",
            "و الان سه سال میشه که روز تولدت ازت هزاران کیلومتر فاصله دارم",
            "تو همه سالایی که گذشت",
            "با همه خوشی ها و ناراحتیاش",
            "روز به روز بیشتر تو دلم جا باز کردی",
            "و الان اندازه خودم دوستت دارم",
            "دور بودن ازت تو این مدت ها",
            "هرروز بهم یاداوری میکرد که قدر روزای کودکی و نوجوونیمون رو ندونستیم",
            "و حالا بزرگسالى نشونمون داد قرار نیس تا همیشه هر زنگ تفریح همو ببینیم",
            "حالا",
            "این هدیه و این نامه صرفا یک یاداوری برای این بود",
            "که بدونی تا همیشه وهمه جا ، تا اخر عمر",
            "جایی که تو قلبم داری رو به هیچکس نمیدم",
            "امیدوارم یه روزی تو سال های اینده",
            "وقتی به همه ارزوهامون رسیدیم",
            "دوباره این نامه رو بخونی",
            "و اونموقع دیگه همه چی بر وفق مراد باشه",
            "خیلی خیلی دوستت دارمم",
            "تولدت مبارک عزیزترینم 🫂❤️❤️❤️",
            "1405/8/1"
        ];

        // پالت رنگی جدید متناسب با بک‌گراند روشن (خاکستری، سرمه‌ای، بادمجان‌وار و مشکی)
        const colors = [
            '#000000', // مشکی
            '#1d2d50', // سرمه‌ای تیره
            '#4a154b', // بادمجونی / بنفش تیره
            '#333333', // خاکستری تیره
            '#1f3a60', // سرمه‌ای ملایم
            '#581845'  // بادمجونی پررنگ
        ];

        const startBtn = document.getElementById('start-btn');
        const container = document.getElementById('container');
        const music = document.getElementById('bg-music');

        startBtn.addEventListener('click', () => {
            // ریست و شروع آهنگ از ابتدا
            music.pause();
            music.currentTime = 0;
            music.play().catch(e => console.log("Audio error", e));

            startBtn.style.display = 'none';
            container.style.display = 'block';
            container.innerHTML = ''; 

            const duration = 15; // زمان حرکت هر خط
            const delayBetweenLines =1.5; // فاصله زمانی کمتر بین خطوط (خطوط فشرده‌تر و سریع‌تر پشت سر هم)

            textLines.forEach((lineText, index) => {
                const div = document.createElement('div');
                div.className = 'line';
                div.innerText = lineText;
                div.style.color = colors[index % colors.length];
                
                div.style.animation = `flowUp ${duration}s linear forwards`;
                div.style.animationDelay = (index * delayBetweenLines) + 's';
                
                container.appendChild(div);
            });

            const totalTime = (textLines.length * delayBetweenLines) + duration;

            // قطع آهنگ و بازگشت دکمه در پایان متن‌ها
            setTimeout(() => {
                music.pause();
                container.innerHTML = '';
                container.style.display = 'none';
                startBtn.style.display = 'block';
            }, totalTime * 1000);
        });
    </script>
</body>
</html>
